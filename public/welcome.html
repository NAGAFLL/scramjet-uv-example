<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Nebula Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0f12 0%, #1a1420 50%, #0f0f12 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: #e0e0e0;
            overflow: hidden;
        }

        .welcome-container {
            text-align: center;
            max-width: 600px;
            padding: 40px 20px;
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 64px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #a5b4fc 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 20px;
            color: #888;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            margin: 50px 0;
        }

        .feature {
            padding: 20px;
            background: rgba(165, 180, 252, 0.08);
            border: 1px solid rgba(165, 180, 252, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }

        .feature:hover {
            background: rgba(165, 180, 252, 0.15);
            border-color: rgba(165, 180, 252, 0.4);
            transform: translateY(-4px);
        }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .feature-text {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a5b4fc;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 40px 0;
        }

        .search-box input {
            flex: 1;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(165, 180, 252, 0.2);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            transition: all 0.2s ease;
            outline: none;
            backdrop-filter: blur(4px);
        }

        .search-box input:focus {
            border-color: rgba(165, 180, 252, 0.5);
            background: rgba(165, 180, 252, 0.08);
            box-shadow: 0 0 0 2px rgba(165, 180, 252, 0.1);
        }

        .search-box input::placeholder {
            color: #666;
        }

        .shortcuts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 30px;
            max-width: 100%;
        }

        .shortcut {
            padding: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: #a5b4fc;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .shortcut:hover {
            background: rgba(165, 180, 252, 0.08);
            border-color: rgba(165, 180, 252, 0.2);
            transform: translateY(-2px);
        }

        .shortcut-icon {
            font-size: 20px;
        }

        .footer {
            margin-top: 50px;
            font-size: 12px;
            color: #666;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 20px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }

            .subtitle {
                font-size: 16px;
            }

            .features {
                grid-template-columns: repeat(2, 1fr);
            }

            .shortcuts {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="logo">🌌</div>
        <h1>Welcome to Nebula</h1>
        <p class="subtitle">The modern web browser</p>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">🚀</div>
                <div class="feature-text">Fast</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🔒</div>
                <div class="feature-text">Private</div>
            </div>
            <div class="feature">
                <div class="feature-icon">✨</div>
                <div class="feature-text">Modern</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🌐</div>
                <div class="feature-text">Unblocker</div>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="welcomeSearch" placeholder="Search or enter URL..." />
        </div>

        <div class="shortcuts">
            <a href="#" class="shortcut" onclick="navigateTo('https://www.google.com'); return false;">
                <span class="shortcut-icon">🔍</span>
                <span>Google</span>
            </a>
            <a href="#" class="shortcut" onclick="navigateTo('https://www.youtube.com'); return false;">
                <span class="shortcut-icon">🎥</span>
                <span>YouTube</span>
            </a>
            <a href="#" class="shortcut" onclick="navigateTo('https://www.github.com'); return false;">
                <span class="shortcut-icon">💻</span>
                <span>GitHub</span>
            </a>
            <a href="#" class="shortcut" onclick="navigateTo('https://www.reddit.com'); return false;">
                <span class="shortcut-icon">👥</span>
                <span>Reddit</span>
            </a>
        </div>

        <div class="footer">
            <p>Nebula Browser - Fast, Private, and Unblocker-Friendly</p>
        </div>
    </div>

    <script>
        function navigateTo(url) {
            // Send message to parent window to navigate
            if (window.parent !== window) {
                window.parent.postMessage({ action: 'navigate', url: url }, '*');
            }
        }

        document.getElementById('welcomeSearch').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const input = e.target.value;
                let url = input;

                try {
                    url = new URL(input).toString();
                } catch (err) {
                    try {
                        const urlObj = new URL(`http://${input}`);
                        if (urlObj.hostname.includes(".")) {
                            url = urlObj.toString();
                        } else {
                            url = `https://www.google.com/search?q=${encodeURIComponent(input)}`;
                        }
                    } catch (err2) {
                        url = `https://www.google.com/search?q=${encodeURIComponent(input)}`;
                    }
                }

                navigateTo(url);
            }
        });
    </script>
</body>
</html>
